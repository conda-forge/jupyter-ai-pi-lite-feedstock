schema_version: 1

context:
  version: "0.1.1"

recipe:
  name: jupyter-ai-pi-lite
  version: ${{ version }}

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: jupyter-ai-pi-lite
    source:
      url: https://pypi.org/packages/source/j/jupyter-ai-pi-lite/jupyter_ai_pi_lite-${{ version }}.tar.gz
      sha256: d6776fbfa61a4fa387aa52b716ce67ff28a90867a53530bd68c8931e59fb0859
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling >=1.5.0
        - hatch-jupyter-builder >=0.5
        - jupyter-builder >=1.2.2
        - pip
      run:
        - python >=${{ python_min }}
        - jupyter-ai-agent-lite >=0.21.0,<0.22
        - jupyter-ai-persona-manager >=0.3.0a0,<0.4
        - jupyter-chat-components >=0.7.0,<0.8
        - jupyter-mcp-manager >=0.2.0,<0.3
        - jupyter-secrets-manager >=0.5,<0.6
        - jupyterlab-chat >=0.25.2,<0.26
    tests:
      - python:
          python_version:
            - ${{ python_min }}.*
            - "*"
          pip_check: true
          imports: jupyter_ai_pi_lite
      - package_contents:
          files:
            - share/jupyter/labextensions/@jupyter-ai/pi-lite/package.json
      - script:
          - jupyter labextension list 2>&1 | rg -ie "@jupyter-ai/pi-lite v.*OK"
        requirements:
          run:
            - python ${{ python_min }}.*
            - jupyterlab >=4.5.0,<5
            - ripgrep
    about:
      summary: "The pi coding agent in JupyterLab and JupyterLite: a chat persona of Jupyter AI"

  - package:
      name: jupyter-ai-pi-lite-terminal
    source:
      url: https://pypi.org/packages/source/j/jupyter-ai-pi-lite-terminal/jupyter_ai_pi_lite_terminal-${{ version }}.tar.gz
      sha256: 4a94c8aa5a46458e6ab8974795165c9f01ad67b0375f89bfd11878a159dd38c0
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling >=1.5.0
        - hatch-jupyter-builder >=0.5
        - jupyter-builder >=1.2.2
        - pip
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage("jupyter-ai-pi-lite", exact=True) }}
        - jupyterlite-core >=0.8.6
        - jupyterlite-terminal >=1.6.2,<2
    tests:
      - python:
          python_version:
            - ${{ python_min }}.*
            - "*"
          pip_check: true
          imports: jupyter_ai_pi_lite_terminal
      - package_contents:
          files:
            - share/jupyter/labextensions/@jupyter-ai/pi-lite-terminal/package.json
      - script:
          - jupyter labextension list 2>&1 | rg -ie "@jupyter-ai/pi-lite v.*OK"
          - jupyter labextension list 2>&1 | rg -ie "@jupyter-ai/pi-lite-terminal v.*OK"
        requirements:
          run:
            - python ${{ python_min }}.*
            - jupyterlab >=4.5.0,<5
            - ripgrep
    about:
      summary: The pi coding agent as a command in the JupyterLite terminal

about:
  homepage: https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite
  repository: https://github.com/jupyter-ai-contrib/jupyter-ai-pi-lite
  documentation: https://jupyter-ai-contrib.github.io/jupyter-ai-pi-lite/
  summary: The pi coding agent in JupyterLab and JupyterLite, as an in-browser persona of Jupyter AI
  description: |
    jupyter-ai-pi-lite runs the pi coding agent (https://pi.dev) in the
    browser, as an in-browser persona of Jupyter AI for JupyterLab, Notebook 7
    and JupyterLite. Pi reads and writes the files of JupyterLab; in
    JupyterLite, it runs shell commands in the in-browser cockle shell.

    - jupyter-ai-pi-lite: pi as a persona in the chats
    - jupyter-ai-pi-lite-terminal: pi as the `pi` command in the JupyterLite
      terminal, with the interactive interface of pi itself
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  feedstock-name: jupyter-ai-pi-lite
  recipe-maintainers:
    - jtpio
